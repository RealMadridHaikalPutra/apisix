openapi: "3.0.3"
info:
  title: Unified Marketplace Gateway
  description: |
    Middleware berbasis Apache APISIX yang menyediakan satu API terpadu untuk
    mengakses berbagai marketplace (Shopee dan TikTok).

    **Fitur utama:**
    - Autentikasi & HMAC-SHA256 signatures (Shopee & TikTok)
    - Token Lifecycle — auto-refresh access token yang expired
    - Parameter & response normalization
    - **Auto detail enrichment** — setiap product list otomatis dilengkapi detail produk
    - **RAW mode** — response dari marketplace TIDAK dimodifikasi, hanya dibungkus

    **Base URL:** `http://localhost:9080`

    **Environment:**
    - Shopee Sandbox: `openplatform.sandbox.test-stable.shopee.sg`
    - TikTok: `open-api.tiktokglobalshop.com`
  version: "1.0.0"
  contact:
    name: Marketplace Gateway Team

servers:
  - url: http://localhost:9080
    description: Local development server

paths:
  # ===========================================================================
  # AUTH ENDPOINTS
  # ===========================================================================

  /auth/token:
    post:
      summary: Mendapatkan Access Token (Initial)
      description: |
        Menukarkan **authorization code (auth_code)** dari OAuth flow marketplace
        dengan access token dan refresh token.

        **Cara mendapatkan auth_code:**

        **Shopee:**
        ```
        https://partner.shopeemobile.com/api/v2/shop/auth_partner?id={partner_id}&redirect={redirect_url}
        ```

        **TikTok:**
        ```
        https://partner.tiktokshop.com/page/oauth/authorize?app_key={app_key}&redirect_uri={redirect_url}&state={state}
        ```
      operationId: getToken
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - marketplace
                - shop_uuid
                - auth_code
              properties:
                marketplace:
                  type: string
                  enum: [shopee, tiktok]
                  description: Marketplace target
                  example: shopee
                shop_uuid:
                  type: string
                  description: UUID shop yang terdaftar di credentials.json
                  example: "227674818"
                auth_code:
                  type: string
                  description: Authorization code dari OAuth flow marketplace
                  example: "your_shopee_auth_code_here"
      responses:
        "200":
          description: Token berhasil didapatkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  marketplace:
                    type: string
                    enum: [shopee, tiktok]
                    example: shopee
                  shop_uuid:
                    type: string
                    example: "227674818"
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        description: Access token untuk API calls
                        example: "eyJhbGciOiJIUzI1NiJ9..."
                      access_token_expires_at:
                        type: integer
                        description: Unix timestamp expiry access token
                        example: 1700000000
                      refresh_token:
                        type: string
                        description: Refresh token untuk memperbarui access token
                        example: "eyJhbGciOiJIUzI1NiJ9..."
                      refresh_token_expires_at:
                        type: integer
                        nullable: true
                        description: Unix timestamp expiry refresh token
                        example: 1730000000
        "400":
          description: Request tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingAuthCode:
                  summary: Auth code tidak disertakan
                  value:
                    error:
                      code: MISSING_AUTH_CODE
                      message: "'auth_code' is required to obtain an access token. Get one from the marketplace OAuth flow."
                      marketplace: shopee
                marketplaceMismatch:
                  summary: Marketplace tidak sesuai dengan shop
                  value:
                    error:
                      code: MARKETPLACE_MISMATCH
                      message: "shop '227674818' is a 'shopee' shop, not 'tiktok'"
                      marketplace: tiktok
        "401":
          description: Re-autentikasi diperlukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: REAUTH_REQUIRED
                  message: "failed to obtain access token: ..."
                  marketplace: shopee

  /auth/refresh:
    post:
      summary: Refresh Access Token
      description: |
        Memperbarui access token yang sudah expired.

        **Opsional** — gateway akan auto-refresh secara otomatis saat product API call
        dilakukan jika token expired. Endpoint ini untuk refresh manual.

        Tidak perlu mengirim `auth_code`. Gateway menggunakan `refresh_token`
        yang tersimpan di `credentials.json`.
      operationId: refreshToken
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - marketplace
                - shop_uuid
              properties:
                marketplace:
                  type: string
                  enum: [shopee, tiktok]
                  description: Marketplace target
                  example: shopee
                shop_uuid:
                  type: string
                  description: UUID shop yang terdaftar di credentials.json
                  example: "227674818"
      responses:
        "200":
          description: Token berhasil direfresh
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  marketplace:
                    type: string
                    example: shopee
                  shop_uuid:
                    type: string
                    example: "227674818"
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiJ9.CIG-SxABGMKVyGwgASjdxf7RBjDh4bL2CTgBQAE..."
                      access_token_expires_at:
                        type: integer
                        example: 1782569757
                      refresh_token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiJ9.CIG-SxABGMKVyGwgAijdxf7RBjDuqdz3CTgBQAE..."
                      refresh_token_expires_at:
                        type: integer
                        nullable: true
                        example: 1730000000
        "400":
          description: Refresh token tidak tersedia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: NO_REFRESH_TOKEN
                  message: "no refresh_token available — call /auth/token first to obtain tokens"
                  marketplace: shopee
        "401":
          description: Refresh token expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: REFRESH_TOKEN_EXPIRED
                  message: "refresh_token has expired — must re-authenticate via /auth/token"
                  marketplace: shopee

  /auth/status:
    post:
      summary: Cek Status Token
      description: |
        Memeriksa status token untuk suatu shop tanpa melakukan API call ke marketplace.
        Berguna untuk mengecek apakah perlu refresh atau re-autentikasi sebelum
        melakukan product API calls.
      operationId: tokenStatus
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - marketplace
                - shop_uuid
              properties:
                marketplace:
                  type: string
                  enum: [shopee, tiktok]
                  example: shopee
                shop_uuid:
                  type: string
                  example: "227674818"
      responses:
        "200":
          description: Status token berhasil didapatkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  marketplace:
                    type: string
                    example: shopee
                  shop_uuid:
                    type: string
                    example: "227674818"
                  data:
                    type: object
                    properties:
                      has_token:
                        type: boolean
                        description: Apakah shop memiliki access token
                        example: true
                      token_expired:
                        type: boolean
                        description: Apakah access token sudah expired
                        example: false
                      token_expires_at:
                        type: integer
                        nullable: true
                        description: Unix timestamp expiry access token
                        example: 1700000000
                      refresh_expired:
                        type: boolean
                        description: Apakah refresh token sudah expired
                        example: false
                      refresh_expires_at:
                        type: integer
                        nullable: true
                        description: Unix timestamp expiry refresh token
                        example: 1730000000
                      needs_refresh:
                        type: boolean
                        description: Apakah perlu refresh (token akan expired dalam 5 menit)
                        example: false
                      needs_reauth:
                        type: boolean
                        description: Apakah perlu re-autentikasi (token & refresh expired)
                        example: false

  # ===========================================================================
  # PRODUCT ENDPOINTS
  # ===========================================================================

  /products:
    get:
      summary: Daftar Produk
      description: |
        Mendapatkan daftar produk dari marketplace.

        **🔥 Auto Detail Enrichment:** Setiap produk dalam response otomatis
        dilengkapi field `_detail` yang berisi response RAW dari endpoint
        detail produk marketplace.

        **Behavior per Marketplace:**
        - **Shopee**: Batch fetch via `get_item_base_info` dengan `item_id_list`
          (1 API call untuk semua produk).
        - **TikTok**: Per-product fetch via `/product/202309/products/{id}`
          (N API calls — signature berbeda setiap kali karena path berubah).

        **Response Mode:**
        - Response adalah **RAW** dari marketplace — TIDAK dinormalisasi.
        - Produk hanya ditambahkan field `_detail` dengan raw detail response.
      operationId: listProducts
      tags:
        - Products
      parameters:
        - name: marketplace
          in: query
          required: true
          description: Marketplace target
          schema:
            type: string
            enum: [shopee, tiktok, all]
          examples:
            shopee:
              summary: Single marketplace (Shopee)
              value: shopee
            tiktok:
              summary: Single marketplace (TikTok)
              value: tiktok
            all:
              summary: Multi-marketplace fan-out
              value: all

        - name: shop_uuid
          in: query
          description: |
            UUID shop (hanya untuk mode single-marketplace `shopee` atau `tiktok`).
            **Tidak digunakan** untuk `marketplace=all`.
          schema:
            type: string
          example: "227674818"

        # ── Fan-out specific params ──
        - name: shop_uuid_shopee
          in: query
          description: |
            UUID Shopee shop (hanya untuk `marketplace=all`).
            Diperlukan jika ingin query Shopee di fan-out mode.
          schema:
            type: string
          example: "227674818"

        - name: shop_uuid_tiktok
          in: query
          description: |
            UUID TikTok shop (hanya untuk `marketplace=all`).
            Diperlukan jika ingin query TikTok di fan-out mode.
          schema:
            type: string
          example: "7494709429666874412"

        # ── Pagination ──
        - name: page
          in: query
          description: "Nomor halaman (min: 1, max: 10000)"
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1

        - name: page_size
          in: query
          description: "Jumlah item per halaman (min: 1, max: 200)"
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          example: 50

        - name: page_token
          in: query
          description: |
            Cursor pagination (TikTok) — isi dengan `next_page_token` dari
            response sebelumnya untuk mengambil halaman berikutnya.
            (Alias: `next_page_token`.)
          schema:
            type: string
          example: "WzE3ODQ4MDc1MTA1NjAsIjE3MzY2NzM4Njg1ODM1Njg0MjgiXQ=="

        # ── Filter ──
        - name: keyword
          in: query
          description: "Kata kunci pencarian produk (max: 200 karakter)"
          schema:
            type: string
            maxLength: 200
          example: "DIMMER"

        - name: status
          in: query
          description: |
            Filter status produk.

            **Mapping:**
            - `ACTIVE` → Shopee: `item_status=NORMAL` / TikTok: `status=ACTIVATE`
            - `INACTIVE` → Shopee: `item_status=BANNED` / TikTok: `status=INACTIVATE`
            - Jika tidak disertakan → default `NORMAL` (aktif)
          schema:
            type: string
            enum: [ACTIVE, INACTIVE]
          example: ACTIVE

      responses:
        "200":
          description: |
            Berhasil mendapatkan daftar produk.

            **Format response tergantung marketplace:**
            - `shopee` / `tiktok` → RAW response marketplace + `_detail` di setiap produk
            - `all` → `{ marketplace: "all", responses: { shopee: {...}, tiktok: {...} } }`
          content:
            application/json:
              examples:
                shopeeResponse:
                  summary: Shopee Products dengan _detail
