  # ===========================================================================
  # ORDER ENDPOINT (TikTok)
  # ===========================================================================

  /order:
    get:
      summary: Order List & Detail (Shopee & TikTok)
      description: |
        Satu endpoint dinamis untuk **order** — menggabungkan **Get Order List**
        dan **Get Order Detail** Shopee & TikTok dalam satu route.

        **Routing otomatis:**
        - Query `ids` diisi → **Detail mode**
          - Shopee: `GET /api/v2/order/get_order_detail`
          - TikTok: `GET /order/202507/orders?ids=...`
        - Query `ids` kosong → **List mode**
          - Shopee: `GET /api/v2/order/get_order_list`
          - TikTok: `POST /order/202309/orders/search`

        **Default List mode (tanpa parameterisasi):**
        - TikTok: status **`UNPAID`**, **`ON_HOLD`**, **`AWAITING_SHIPMENT`**
        - Shopee: status **`UNPAID`**, **`READY_TO_SHIP`**

        Karena TikTok & Shopee hanya menerima satu `order_status` per request,
        gateway melakukan 1 API call per status, **menggabungkan (merge)** hasilnya,
        lalu **mengagregasi** line items per SKU/variant. Untuk Shopee, hasil merge
        otomatis **di-enrich** dengan Get Order Detail (batch max 50 `order_sn` per
        call) karena Get Order List hanya mengembalikan `order_sn` + `order_status`.

        **Required Scope:** Shopee `orders` · TikTok `seller.order.info`

        **Response mode:**
        - Default: response terunifikasi `{ marketplace, reserved_stock }` — agregasi
          line items per SKU/variant. Hanya order berstatus reserved per marketplace
          yang dihitung ke `total_reserved_stock`:
          - TikTok: `UNPAID`, `ON_HOLD`, `AWAITING_SHIPMENT`
          - Shopee: `UNPAID`, `READY_TO_SHIP`
        - **Cara hitung:** TikTok tidak mengembalikan field `quantity` pada line items
          (1 unit = 1 line item dengan `id` unik); Shopee mengembalikan
          `model_quantity_purchased` (quantity eksplisit). Jadi `reserved_stock` per
          order = jumlah unit line item dengan `sku_id` (Shopee: `model_id`) yang sama.
        - `translate=false` → raw (merged) response marketplace
      operationId: listOrders
      tags:
        - Orders
      parameters:
        - name: marketplace
          in: query
          required: true
          description: Marketplace target (hanya tiktok untuk saat ini)
          schema:
            type: string
            enum: [tiktok]
          example: tiktok

        - name: shop_uuid
          in: query
          required: true
          description: UUID shop TikTok yang terdaftar di credentials.json
          schema:
            type: string
          example: "7494709429666874412"

        - name: ids
          in: query
          description: |
            Order IDs dipisahkan koma (max 50). Jika diisi → **Detail mode**
            (Get Order Detail). Jika kosong → **List mode** (Get Order List).
          schema:
            type: string
          example: "576461413038785752,576461413038785753"

        - name: status
          in: query
          description: |
            Filter status order (List mode). Default per marketplace (semua
            di-fetch dan di-merge):
            - TikTok: `UNPAID`, `ON_HOLD`, `AWAITING_SHIPMENT`
            - Shopee: `UNPAID`, `READY_TO_SHIP`

            Nilai yang didukung TikTok:
            `UNPAID`, `ON_HOLD`, `AWAITING_SHIPMENT`, `PARTIALLY_SHIPPING`,
            `AWAITING_COLLECTION`, `IN_TRANSIT`, `DELIVERED`, `COMPLETED`, `CANCELLED`

            Nilai yang didukung Shopee:
            `UNPAID`, `READY_TO_SHIP`, `SHIPPED`, `COMPLETED`, `CANCELLED`,
            `IN_CANCEL`, `INVOICE_PENDING`
          schema:
            type: string
          example: UNPAID

        - name: page
          in: query
          description: Nomor halaman (metadata response)
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1

        - name: page_size
          in: query
          description: "Jumlah order per halaman (1–100, TikTok & Shopee)"
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          example: 20

        - name: page_token
          in: query
          description: Cursor pagination — isi dengan `next_page_token` dari response sebelumnya
          schema:
            type: string
          example: "6AsPQsUMvH3RkchNUPPh22NROHkE0D8pmq/N5M1kHYcZmtRyv9aVrNv65W7Q6tFA+7D1ud64MPNz5OaT"

        - name: sort_field
          in: query
          description: Field sorting (List mode)
          schema:
            type: string
            enum: [create_time, update_time]
            default: create_time
          example: create_time

        - name: sort_order
          in: query
          description: Arah sorting (List mode)
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
          example: DESC

        - name: create_time_ge
          in: query
          description: Filter order dibuat pada/Setelah Unix timestamp
          schema:
            type: integer
          example: 1710000000

        - name: create_time_lt
          in: query
          description: Filter order dibuat sebelum Unix timestamp
          schema:
            type: integer
          example: 1719999999

        - name: update_time_ge
          in: query
          description: Filter order diupdate pada/Setelah Unix timestamp
          schema:
            type: integer
          example: 1710000000

        - name: update_time_lt
          in: query
          description: Filter order diupdate sebelum Unix timestamp
          schema:
            type: integer
          example: 1719999999

        - name: shipping_type
          in: query
          description: Metode pengiriman (List mode)
          schema:
            type: string
            enum: [TIKTOK, SELLER, TIKTOK_DIGITAL]
          example: TIKTOK

        - name: buyer_user_id
          in: query
          description: Filter berdasarkan buyer user ID
          schema:
            type: string
          example: "7213489962827123654"

        - name: is_buyer_request_cancel
          in: query
          description: Filter order dengan permintaan cancel dari buyer
          schema:
            type: boolean
          example: false

        - name: warehouse_ids
          in: query
          description: Filter gudang — pisahkan dengan koma (multi-warehouse)
          schema:
            type: string
          example: "7000714532876273888,7000714532876273666"

        - name: translate
          in: query
          description: |
            `false` → kembalikan raw (merged) response TikTok tanpa normalisasi.
            Default `true` → response terunifikasi `{ marketplace, orders, pagination }`.
          schema:
            type: boolean
            default: true
          example: true

      responses:
        "200":
          description: |
            Order berhasil didapatkan.

            **List mode** → semua order yang di-fetch **di-merge** lalu **diagregasi**
            per SKU/variant menjadi `reserved_stock[]`.
            **Detail mode** → order sesuai `ids` yang diminta ikut diagregasi.

            **Catatan:** response translate final **hanya** berisi agregasi
            `{ marketplace, reserved_stock }` (tanpa array `orders` & `pagination`).
            Hanya order berstatus `UNPAID`, `ON_HOLD`, atau `AWAITING_SHIPMENT`
            yang dihitung ke `total_reserved_stock`.
          content:
            application/json:
              example:
                marketplace: tiktok
                reserved_stock:
                  - product_id: "1736033390941733932"
                    variants:
                      - variant_id: "1736032926678615084"
                        seller_sku: "1A1"
                        total_reserved_stock: 8
                        orders:
                          - order_id: "576461413038785752"
                            status: UNPAID
                            reserved_stock: 3
                          - order_id: "576461413038785753"
                            status: ON_HOLD
                            reserved_stock: 5
                  - product_id: "1736268650108650540"
                    variants:
                      - variant_id: "1736268732805121068"
                        seller_sku: "1K1"
                        total_reserved_stock: 2
                        orders:
                          - order_id: "585150072415487781"
                            status: AWAITING_SHIPMENT
                            reserved_stock: 2
        "400":
          description: Parameter tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidParameter:
                  summary: Parameter tidak valid
                  value:
                    error:
                      code: INVALID_PARAMETER
                      message: "invalid parameter value"
                      marketplace: shopee
        "500":
          description: Error dari TikTok upstream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: UPSTREAM_ERROR
                  message: "upstream request failed"
                  marketplace: tiktok
                  original_status: 500
                  original_code: "36009003"
                  request_id: "8cd88fda-3d14-4859-ba2f-85ea867332af"
        "502":
          description: Gagal fetch order untuk semua status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: UPSTREAM_ERROR
                  message: "failed to fetch orders from marketplace"

  # ===========================================================================
  # WEBHOOK FORWARDER
  # ===========================================================================

  /webhook/register:
    post:
      summary: Daftarkan URL Backend untuk Webhook Forwarding
      description: |
        Mendaftarkan URL backend yang akan menerima forwarded webhook dari marketplace.

        Setelah URL didaftarkan, setiap webhook yang diterima dari Shopee atau TikTok
        akan otomatis diferuskan (forward) ke URL backend dalam format:

        ```json
        {
          "marketplace": "shopee|tiktok",
          "event_type": "stock_update|challenge|...",
          "received_at": "2026-07-22T10:00:00Z",
          "payload": { ... original webhook body ... }
        }
        ```

        **Satu URL untuk semua marketplace** — webhook dari Shopee dan TikTok
        dikirim ke URL yang sama.

        **Async forwarding** — forwarding dilakukan secara asinkron setelah response
        dikirim ke marketplace, jadi tidak mempengaruhi latency.
      operationId: registerWebhook
      tags:
        - Webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - url
              properties:
                url:
                  type: string
                  description: URL backend yang akan menerima forwarded webhooks
                  format: uri
                  example: "https://my-backend.com/webhooks/receiver"
      responses:
        "200":
          description: URL berhasil didaftarkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "webhook forwarder URL registered"
                  data:
                    type: object
                    properties:
                      backend_url:
                        type: string
                        example: "https://my-backend.com/webhooks/receiver"
                      updated_at:
                        type: string
                        format: date-time
                        example: "2026-07-22T10:00:00Z"
        "400":
          description: Request tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingUrl:
                  summary: URL tidak disertakan
                  value:
                    success: false
                    error:
                      code: MISSING_URL
                      message: "'url' field is required and must be a non-empty string"
                invalidUrl:
                  summary: Format URL salah
                  value:
                    success: false
                    error:
                      code: INVALID_URL
                      message: "'url' must start with http:// or https://"
        "500":
          description: Gagal menyimpan konfigurasi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: SAVE_FAILED
                  message: "failed to save webhook forwarder URL"

    get:
      summary: Cek URL Backend Terdaftar
      description: Mengembalikan URL backend yang sedang terdaftar untuk webhook forwarding.
      operationId: getWebhookRegistration
      tags:
        - Webhook
      responses:
        "200":
          description: Konfigurasi forwarder
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    nullable: true
                    properties:
                      backend_url:
                        type: string
                        example: "https://my-backend.com/webhooks/receiver"
                      updated_at:
                        type: string
                        format: date-time
                        example: "2026-07-22T10:00:00Z"

  # ===========================================================================
  # HEALTH / INFO
  # ===========================================================================

  /:
    get:
      summary: Root endpoint
      description: Root endpoint — mengembalikan informasi dasar gateway
      operationId: rootInfo
      tags:
        - System
      responses:
        "200":
          description: Informasi gateway
          content:
            application/json:
              example:
                service: "Unified Marketplace Gateway"
                version: "1.0.0"
                endpoints:
                  - "POST /auth/token"
                  - "POST /auth/refresh"
                  - "POST /auth/status"
                  - "GET /products"
                  - "POST /products/create"
                  - "GET /products/{id}"
                  - "GET /order"
                  - "POST /webhook/shopee"
                  - "POST /webhook/tiktok"
                  - "POST /webhook/register"
                  - "GET /webhook/register"
                marketplaces:
                  - shopee
                  - tiktok

components:
  schemas:
    # ── Error Response ───────────────────────────────────────────────────
    ErrorResponse:
      type: object
      description: >
        Format error seragam untuk semua endpoint.
        Field `original_status` dan `original_code` hanya ada jika error berasal
        dari marketplace upstream (bukan dari gateway sendiri).
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Kode error terunifikasi
              example: UPSTREAM_ERROR
            message:
              type: string
              nullable: true
              description: Pesan error dalam bahasa Inggris
              example: "upstream server returned an error"
            marketplace:
              type: string
              nullable: true
              enum: [shopee, tiktok]
              description: Marketplace asal error (null jika error dari gateway)
            original_status:
              type: integer
              nullable: true
              description: HTTP status code asli dari marketplace
              example: 500
            original_code:
              type: string
              nullable: true
              description: Kode error asli dari marketplace
              example: "product.error_unknown"
            request_id:
              type: string
              nullable: true
              description: ID unik request untuk tracing
              example: "c0146e90-8e63-4efa-abac-8e875f7d3974"

    # ── Error Codes ─────────────────────────────────────────────────────
    ErrorCode:
      type: string
      enum:
        - MISSING_MARKETPLACE
        - UNSUPPORTED_MARKETPLACE
        - MISSING_PARAMS
        - MISSING_AUTH_CODE
        - MARKETPLACE_MISMATCH
        - ENDPOINT_NOT_FOUND
        - ENDPOINT_NOT_SUPPORTED
        - SHOP_NOT_FOUND
        - SHOP_INACTIVE
        - NO_TOKEN
        - NO_REFRESH_TOKEN
        - REAUTH_REQUIRED
        - REFRESH_TOKEN_EXPIRED
        - TOKEN_ERROR
        - REFRESH_ERROR
        - CREDENTIALS_ERROR
        - INVALID_PARAMETER
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - RATE_LIMITED
        - UPSTREAM_ERROR
        - INTERNAL_ERROR
        - NO_ADAPTER
        - NO_CREDENTIALS
        - NO_SHOPS
        - NO_ACTIVE_SHOPS
        - FANOUT_ERROR
        - MAPPING_ERROR
        - ADAPTER_LOAD_FAILED
      description: |
        Daftar semua error codes yang mungkin:

        | Code | HTTP Status | Description |
        |------|-------------|-------------|
        | MISSING_MARKETPLACE | 400 | Parameter marketplace tidak disertakan |
        | UNSUPPORTED_MARKETPLACE | 400 | Marketplace tidak didukung |
        | MISSING_PARAMS | 400 | Parameter wajib tidak disertakan |
        | MISSING_AUTH_CODE | 400 | Auth code tidak disertakan |
        | MARKETPLACE_MISMATCH | 400 | Shop bukan untuk marketplace ini |
        | ENDPOINT_NOT_FOUND | 404 | Endpoint tidak dikenal |
        | ENDPOINT_NOT_SUPPORTED | 400 | Endpoint tidak didukung marketplace |
        | SHOP_NOT_FOUND | 404 | Shop UUID tidak ditemukan |
        | SHOP_INACTIVE | 403 | Status shop bukan active |
        | NO_TOKEN | 401 | Belum ada access token |
        | NO_REFRESH_TOKEN | 400 | Tidak ada refresh token |
        | REAUTH_REQUIRED | 401 | Refresh token expired |
        | REFRESH_TOKEN_EXPIRED | 401 | Refresh token expired |
        | TOKEN_ERROR | 400 | Gagal mendapatkan token |
        | REFRESH_ERROR | 400 | Gagal refresh token |
        | CREDENTIALS_ERROR | 400 | Error kredensial |
        | INVALID_PARAMETER | 400 | Parameter tidak valid |
        | UNAUTHORIZED | 401 | Autentikasi gagal |
        | FORBIDDEN | 403 | Tidak punya akses |
        | NOT_FOUND | 404 | Resource tidak ditemukan |
        | RATE_LIMITED | 429 | Rate limit tercapai |
        | UPSTREAM_ERROR | 500 | Error dari marketplace |
        | INTERNAL_ERROR | 500 | Internal gateway error |
        | FANOUT_ERROR | 502 | Semua marketplace gagal di fan-out |

    # ── Mapping Reference ──────────────────────────────────────────────
    ParameterMapping:
      type: object
      description: >
        Mapping parameter unified ke format spesifik marketplace.
      properties:
        marketplace:
          type: string
          enum: [shopee, tiktok]
        unified_param:
          type: string
          description: Nama parameter di API Gateway
        marketplace_param:
          type: string
          description: Nama parameter yang dikirim ke marketplace API
      example:
        - marketplace: shopee
          unified: "page"
          shopee: "offset = (page-1) × page_size"
        - marketplace: shopee
          unified: "page_size"
          shopee: "page_size"
        - marketplace: shopee
          unified: "keyword"
          shopee: "search_keyword"
        - marketplace: shopee
          unified: "status (ACTIVE)"
          shopee: "item_status = NORMAL"
        - marketplace: tiktok
          unified: "page"
          tiktok: "page_token (cursor-based)"
        - marketplace: tiktok
          unified: "page_size"
          tiktok: "page_size"
        - marketplace: tiktok
          unified: "status (ACTIVE)"
          tiktok: "status = ACTIVATE (dalam POST body)"

  # ── Request Body Schemas ─────────────────────────────────────────────
  requestBodies:
    AuthRequest:
      type: object
      required:
        - marketplace
        - shop_uuid
      properties:
        marketplace:
          type: string
          enum: [shopee, tiktok]
        shop_uuid:
          type: string

tags:
  - name: Authentication
    description: |
      **Token Management Endpoints**

      Gateway menggunakan **plugin chain** untuk autentikasi otomatis:

      ```
      Request → credential-loader (rewrite) → marketplace-router (rewrite)
      → request-transformer (access)
      ```

      - **credential-loader**: Load kredensial shop + auto-refresh token jika expired
      - **marketplace-router**: Tentukan adapter marketplace
      - **request-transformer**: Generate signature HMAC-SHA256, call API langsung via resty.http

      **Auto-Refresh:** Gateway secara otomatis me-refresh access token yang expired
      saat melakukan product API calls — tanpa perlu manual refresh.

  - name: Products
    description: |
      **Product Endpoints**

      Semua response produk adalah **RAW dari marketplace** — tidak dinormalisasi.

      **Auto Detail Enrichment:**
      Saat mengakses `GET /products`, gateway secara otomatis:
      1. Fetch product list dari marketplace
      2. Extract product IDs
      3. Fetch detail untuk setiap produk
      4. Embed `_detail` field di setiap entry produk

      **Shopee:** Batch fetch via `get_item_base_info` (1 API call)
      **TikTok:** Per-product fetch via `/product/202309/products/{id}` (N API calls)

  - name: Orders
    description: |
      **Order Endpoints (Shopee & TikTok)**

      `GET /order` adalah endpoint dinamis yang menggabungkan Get Order List
      dan Get Order Detail Shopee & TikTok:

      - `ids` diisi → Detail mode
        (Shopee: `GET /api/v2/order/get_order_detail` · TikTok: `GET /order/202507/orders?ids=...`)
      - `ids` kosong → List mode
        (Shopee: `GET /api/v2/order/get_order_list` · TikTok: `POST /order/202309/orders/search`)

      Default tanpa parameterisasi:
      - TikTok mengambil status `UNPAID`, `ON_HOLD`, dan `AWAITING_SHIPMENT`
      - Shopee mengambil status `UNPAID` dan `READY_TO_SHIP`

      Response dari setiap status **di-merge** ke satu array, lalu diagregasi
      menjadi `reserved_stock` per SKU/variant.

  - name: System
    description: Endpoint informasi sistem

# ── External Docs ──────────────────────────────────────────────────────────
externalDocs:
  description: Dokumentasi lengkap (README)
  url: ./DOCUMENTATION.md
