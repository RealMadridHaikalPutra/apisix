  # ── POST /products — Inventory Search (TikTok Only) ───────────────────
  # Auto-detected: if request body contains product_ids or sku_ids,
  # gateway routes to TikTok Inventory Search API.
  # Body: { product_ids: [...], sku_ids: [...] }
    post:
      summary: Cari Inventory Produk/SKU (TikTok Only, auto-detected)
      description: |
        Mencari informasi inventory untuk produk atau SKU tertentu di TikTok Shop.
        Endpoint ini adalah `/products` yang sama — gateway auto-detect dari body request.

        **Fitur:**
        - Kirim `product_ids` atau `sku_ids` di body → otomatis jadi Inventory Search
        - Kirim body biasa (status, keyword) → Product Search seperti biasa
        - Jika kedua parameter dikirim, `sku_ids` akan diprioritaskan
        - Mengembalikan detail stok per-warehouse
        - Distribusi inventory (campaign, creator, in-shop)

        **Required Scope:** `seller.product.basic`

        **TikTok Endpoint:** `POST /product/202309/inventory/search`
      operationId: inventorySearch
      tags:
        - Products
        - Inventory
      parameters:
        - name: marketplace
          in: query
          required: true
          description: Marketplace target (hanya tiktok)
          schema:
            type: string
            enum: [tiktok]
          example: tiktok

        - name: shop_uuid
          in: query
          required: true
          description: UUID shop TikTok yang terdaftar di credentials.json
          schema:
            type: string
          example: "7494709429666874412"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product_ids:
                  type: array
                  description: Daftar product IDs (max 100)
                  items:
                    type: string
                  example: ["1729592969712207008"]
                sku_ids:
                  type: array
                  description: Daftar SKU IDs (max 600). Diprioritaskan jika dikirim bersama product_ids
                  items:
                    type: string
                  example: ["1729388324987897824"]

      responses:
        "200":
          description: |
            Informasi inventory berhasil didapatkan.

            Response dibungkus dalam format:
            ```json
            {
              "marketplace": "tiktok",
              "raw_response": { ... RAW dari TikTok Inventory Search API ... }
            }
            ```
          content:
            application/json:
              example:
                marketplace: tiktok
                raw_response:
                  code: 0
                  data:
                    inventory:
                      - product_id: "1729592969712207008"
                        skus:
                          - id: "1729388324987897824"
                            seller_sku: "Color-Red-XM01"
                            total_available_quantity: 100
                            total_committed_quantity: 10
                            warehouse_inventory:
                              - warehouse_id: "7054915283043174149"
                                available_quantity: 100
                                committed_quantity: 10
                            total_available_inventory_distribution:
                              campaign_inventory:
                                - quantity: 30
                                  campaign_name: "Big Sale"
                              creator_inventory:
                                - quantity: 20
                                  creator_name: "py001"
                              in_shop_inventory:
                                quantity: 50
                  message: "Success"
                  request_id: "202203070749000101890810281E8C70B7"
        "400":
          description: Parameter tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingBody:
                  summary: Body tidak disertakan
                  value:
                    error:
                      code: MISSING_BODY
                      message: "request body is required"
                invalidJson:
                  summary: Format JSON salah
                  value:
                    error:
                      code: INVALID_JSON
                      message: "invalid JSON in request body"
                unsupportedMarketplace:
                  summary: Marketplace tidak didukung
                  value:
                    error:
                      code: ENDPOINT_NOT_SUPPORTED
                      message: "endpoint 'inventory_search' not supported for marketplace 'shopee'"
        "500":
          description: Error dari TikTok upstream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: UPSTREAM_ERROR
                  message: "upstream request failed"
                  marketplace: tiktok
                  original_status: 500
                  original_code: "36009003"
                  request_id: "8cd88fda-3d14-4859-ba2f-85ea867332af"

  /products/create:
    post:
      summary: Buat Produk Baru
      description: |
        Membuat produk baru di marketplace.

        **Endpoint Dinamis:** Bekerja untuk Shopee maupun TikTok — gateway secara otomatis
        menerjemahkan request body terunifikasi ke format spesifik masing-masing marketplace.

        **Shopee:** `POST /api/v2/product/add_item`
        **TikTok:** `POST /product/202309/products`

        **Required Scope:**
        - TikTok: `seller.product.write`
        - Shopee: Akses ke Shopee Product API
      operationId: createProduct
      tags:
        - Products
      parameters:
        - name: marketplace
          in: query
          required: true
          description: Marketplace target
          schema:
            type: string
            enum: [shopee, tiktok]
          example: shopee

        - name: shop_uuid
          in: query
          required: true
          description: UUID shop yang terdaftar di credentials.json
          schema:
            type: string
          example: "227674818"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - category_id
                - skus
              properties:
                title:
                  type: string
                  description: Nama produk
                  example: "Kemeja Flanel Pria Lengan Panjang"
                description:
                  type: string
                  description: Deskripsi produk dalam format HTML (TikTok) atau teks biasa (Shopee)
                  example: "<p>Kemeja flanel berkualitas tinggi, bahan nyaman dipakai sehari-hari.</p>"
                category_id:
                  type: string
                  description: ID kategori produk
                  example: "600001"
                brand_id:
                  type: string
                  description: ID brand (opsional)
                  example: "7082427311584347905"
                save_mode:
                  type: string
                  description: |
                    Mode penyimpanan produk.
                    - `LISTING` (default): Langsung publish
                    - `AS_DRAFT`: Simpan sebagai draft
                  enum: [LISTING, AS_DRAFT]
                  default: LISTING
                  example: LISTING
                main_images:
                  type: array
                  description: "Daftar gambar utama produk (TikTok: URI dari Upload API, Shopee: image_id_list)"
                  items:
                    type: object
                    properties:
                      uri:
                        type: string
                        description: URI gambar dari marketplace Upload API
                        example: "tos-maliva-i-o3syd03w52-us/c668cdf70b7f483c94dbe"
                  example:
                    - uri: "tos-maliva-i-o3syd03w52-us/c668cdf70b7f483c94dbe"
                skus:
                  type: array
                  description: Daftar SKU/variasi produk (min 1)
                  items:
                    type: object
                    properties:
                      seller_sku:
                        type: string
                        description: Kode SKU internal penjual
                        example: "FLANEL-RED-XL"
                      price:
                        type: object
                        properties:
                          amount:
                            type: string
                            description: Harga jual
                            example: "150000"
                          currency:
                            type: string
                            description: Mata uang (IDR, USD, dll)
                            example: "IDR"
                      inventory:
                        type: array
                        description: Informasi stok per gudang
                        items:
                          type: object
                          properties:
                            warehouse_id:
                              type: string
                              description: ID gudang
                              example: "7068517275539719942"
                            quantity:
                              type: integer
                              description: Jumlah stok
                              example: 100
                      sales_attributes:
                        type: array
                        description: Atribut variasi (warna, ukuran, dll)
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: Nama atribut (Color, Size, dll)
                              example: "Color"
                            value_name:
                              type: string
                              description: Nilai atribut (Red, XL, dll)
                              example: "Red"
                  example:
                    - seller_sku: "FLANEL-RED-XL"
                      price:
                        amount: "150000"
                        currency: "IDR"
                      inventory:
                        - warehouse_id: "7068517275539719942"
                          quantity: 100
                      sales_attributes:
                        - name: "Color"
                          value_name: "Red"
                        - name: "Size"
                          value_name: "XL"
                package_weight:
                  type: object
                  description: Berat paket
                  properties:
                    value:
                      type: string
                      example: "1.5"
                    unit:
                      type: string
                      enum: [KILOGRAM, GRAM, POUND]
                      example: "KILOGRAM"
                package_dimensions:
                  type: object
                  description: Dimensi paket
                  properties:
                    length:
                      type: string
                      example: "10"
                    width:
                      type: string
                      example: "10"
                    height:
                      type: string
                      example: "10"
                    unit:
                      type: string
                      enum: [CENTIMETER, INCH]
                      example: "CENTIMETER"
                is_cod_allowed:
                  type: boolean
                  description: Mengizinkan pembayaran COD
                  example: true
                external_product_id:
                  type: string
                  description: ID produk dari platform eksternal
                  example: "EXT-PROD-001"
                product_attributes:
                  type: array
                  description: Atribut produk tambahan
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        example: "100392"
                      values:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                              example: "1001533"
                            name:
                              type: string
                              example: "Birthday"
                shipping_template_id:
                  type: string
                  description: ID template pengiriman
                  example: "7552764259994699538"
                idempotency_key:
                  type: string
                  description: Key unik untuk mencegah duplikasi (recommended untuk TikTok)
                  maxLength: 128
                  example: "create202208291503530001100220033"

      responses:
        "200":
          description: |
            Produk berhasil dibuat.

            Response terunifikasi:
            ```json
            {
              "marketplace": "shopee|tiktok",
              "action": "create_product",
              "success": true,
              "data": {
                "product_id": "123456",
                "skus": [{ "id": "...", "seller_sku": "..." }],
                "raw_response": { ... RAW dari marketplace ... }
              }
            }
            ```
          content:
            application/json:
              examples:
                shopeeCreateResponse:
                  summary: Shopee Create Product Success
                  value:
                    marketplace: shopee
                    action: create_product
                    success: true
                    data:
                      product_id: "123456789"
                      warning: ""
                      raw_response:
                        item_id: 123456789
                        warning: ""

                tiktokCreateResponse:
                  summary: TikTok Create Product Success
                  value:
                    marketplace: tiktok
                    action: create_product
                    success: true
                    data:
                      product_id: "1736033390941733932"
                      skus:
                        - id: "1736032926678615084"
                          seller_sku: "FLANEL-RED-XL"
                      raw_response:
                        product_id: "1736033390941733932"
                        skus:
                          - id: "1736032926678615084"
                            seller_sku: "FLANEL-RED-XL"

        "400":
          description: Parameter tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingBody:
                  summary: Body tidak disertakan
                  value:
                    error:
                      code: MISSING_BODY
                      message: "request body is required"
                missingTitle:
                  summary: Title tidak disertakan
                  value:
                    error:
                      code: INVALID_PARAMETER
                      message: "title is required"
                missingCategory:
                  summary: Category ID tidak disertakan
                  value:
                    error:
                      code: INVALID_PARAMETER
                      message: "category_id is required"
                missingSkus:
                  summary: SKU tidak disertakan
                  value:
                    error:
                      code: INVALID_PARAMETER
                      message: "at least one sku is required"
                invalidJson:
                  summary: Format JSON salah
                  value:
                    error:
                      code: INVALID_JSON
                      message: "invalid JSON in request body"
                endpointNotSupported:
                  summary: Marketplace tidak mendukung
                  value:
                    error:
                      code: ENDPOINT_NOT_SUPPORTED
                      message: "endpoint 'create_product' not supported for marketplace 'shopee'"
        "401":
          description: Autentikasi gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: UNAUTHORIZED
                  message: "invalid access token"
                  marketplace: shopee
                  original_status: 401
                  original_code: "error_auth"
                  request_id: "8cd88fda-3d14-4859-ba2f-85ea867332af"
        "500":
          description: Error dari marketplace upstream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: UPSTREAM_ERROR
                  message: "some product attributes are missing"
                  marketplace: tiktok
                  original_status: 200
                  original_code: "10001"
                  request_id: "3f51e14b-e62f-464f-b48d-ed470017eaae"

