  /update-status/{product_id}:
    post:
      summary: Update Status Produk
      description: |
        Mengubah status (ACTIVE/INACTIVE) produk di marketplace.

        **Shopee:** Menggunakan endpoint `POST /api/v2/product/update_item` dengan
        parameter `item_id` dan `item_status` (NORMAL/UNLIST).

        **TikTok:**
        - ACTIVE → `POST /product/202309/products/activate`
        - INACTIVE → `POST /product/202309/products/deactivate`
        - Mendukung **batch update** (max 20 product_ids via body)

        **Catatan:**
        - `marketplace=all` tidak didukung (mutasi per-shop).
        - TikTok DRAFT product tidak bisa langsung di-activate (perlu setup lengkap).
        - Shopee deactivate (UNLIST) sudah terverifikasi berfungsi.

        **Tested:**
        - ✅ Shopee DEACTIVATE: 802023254 (NORMAL → UNLIST)
        - ✅ TikTok DEACTIVATE: endpoint routing berfungsi
        - ⚠️ TikTok ACTIVATE DRAFT: butuh setup tambahan sebelum aktivasi
      operationId: updateStatus
      tags:
        - Products
      parameters:
        - name: product_id
          in: path
          required: false
          description: ID produk di marketplace (optional jika pakai product_ids di body)
          schema:
            type: string
          example: "802023254"

        - name: marketplace
          in: query
          required: true
          description: Marketplace target
          schema:
            type: string
            enum: [shopee, tiktok]
          example: shopee

        - name: shop_uuid
          in: query
          required: true
          description: UUID shop yang terdaftar di credentials.json
          schema:
            type: string
          example: "227674818"

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE]
                  description: Target status
                  example: ACTIVE
                product_ids:
                  type: array
                  description: Batch product IDs (TikTok, max 20). Optional — fallback ke product_id dari path.
                  items:
                    type: string
                  example: ["1736673915168916524", "1736674150837486636"]
                listing_platforms:
                  type: array
                  description: Platform listing (TikTok only, untuk seller migrasi dari Tokopedia)
                  items:
                    type: string
                    enum: [TIKTOK_SHOP, TOKOPEDIA]
                  example: ["TIKTOK_SHOP"]

      responses:
        "200":
          description: Status berhasil diupdate
          content:
            application/json:
              examples:
                shopeeDeactivate:
                  summary: Shopee Deactivate Success
                  value:
                    marketplace: shopee
                    action: update_status
                    status: INACTIVE
                    raw_response:
                      error: ""
                      message: ""
                      request_id: "e3e3e7f357cdb60a43f217b4bfb87d00"
                      response:
                        item_id: 802023254
                        item_status: UNLIST
                        item_name: "Logo Mirorim"

                tiktokActivate:
                  summary: TikTok Activate Response (dengan errors jika ada partial failure)
                  value:
                    marketplace: tiktok
                    action: update_status
                    status: ACTIVE
                    raw_response:
                      code: 0
                      message: Success
                      request_id: "20260730135458C9929331D99EBF0701B4"
                      data:
                        errors:
                          - code: 12052990
                            message: "Batch activate business error."
                            detail:
                              product_id: "1736784139476829228"
                              extra_errors:
                                - code: 12052901
                                  message: "product status invalid"

        "400":
          description: Parameter tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingStatus:
                  summary: Status tidak disertakan
                  value:
                    error:
                      code: MISSING_STATUS
